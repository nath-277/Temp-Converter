<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Temp Converter</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <br><br><br>
  <div id="container">
    <span id="title">Temp Converter</span>
    <input type="number" value="0" id="value" /><br>

    <div class="radio-group">
      <label>
        <input type="radio" name="unit" id="toFahrenheit" />
        Celsius ➡️ Fahrenheit
      </label><br>

      <label>
        <input type="radio" name="unit" id="toCelcius" />
        Fahrenheit ➡️ Celsius
      </label>
    </div>

    <button id="submit" onclick="convert()">Submit</button>
    <h2 id="response">Select a unit</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
